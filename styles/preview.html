<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>media-toolkit styles</title>
<style>
  :root { color-scheme: light; --ink:#1d1d1f; --muted:#6b6b70; --rule:#e2e2e4; }
  * { box-sizing: border-box; }
  body { margin:0; background:#fff; color:var(--ink); font:16px/1.65 "PingFang SC","Noto Sans CJK SC",system-ui,sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 28px 96px; }
  header p { max-width: 62ch; color: var(--muted); margin: 8px 0 0; }
  h1 { font-size: 30px; line-height: 1.25; margin: 0; font-weight: 600; }
  section { padding: 56px 0; border-top: 1px solid var(--rule); }
  section:first-of-type { margin-top: 40px; }
  h2 { font-size: 24px; margin: 0 0 4px; font-weight: 600; }
  .idea { color: var(--muted); margin: 0 0 24px; max-width: 70ch; }
  .samples { display: grid; grid-template-columns: 16fr 6.2fr; gap: 20px; align-items: start; }
  .samples svg { width: 100%; height: auto; display: block; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .cap { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .spec { display: grid; grid-template-columns: 7.5em 1fr; gap: 6px 16px; margin-top: 24px; max-width: 900px; }
  .spec dt { color: var(--muted); }
  .spec dd { margin: 0; }
  .sw { display: inline-flex; align-items: center; gap: 6px; margin: 0 14px 4px 0; font-size: 14px; }
  .sw i { width: 18px; height: 18px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); display: inline-block; }
  code { font: 13px/1.5 "SF Mono", Menlo, monospace; background: #f4f4f5; padding: 1px 5px; border-radius: 3px; }
  .note { margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--rule); max-width: 70ch; }
  @media (max-width: 760px) { .samples { grid-template-columns: 1fr; } .spec { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>media-toolkit styles</h1>
    <p>Preview of the style presets in this directory: the same diagram and cover in each style. Sample content is Chinese to show the fonts. The rules live in each .md; keep the colors here in sync when you change them.</p>
  </header>
  <div id="schemes"></div>

</main>

<script>
const SERIF = '"Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC",serif';
const SANS  = '"PingFang SC","Noto Sans CJK SC",sans-serif';
const MONO  = '"Courier New","Courier",monospace';

const schemes = [
  {
    key: "A", name: "A · Punch card",
    idea: "The 1928 IBM 80-column punch card: a hole is 1, no hole is 0. See punch-card.md.",
    bg: "#E9DFC4", ink: "#2A2723", muted: "#8A7F68", accent: "#1C4FB8", hotFill: "#C8D5F0", fillA: "#DCCFAE", fillB: "#DCCFAE",
    title: SERIF, num: MONO, texture: "punch",
    palette: [["", "#E9DFC4"], ["", "#2A2723"], ["", "#8A7F68"], ["", "#1C4FB8"], ["", "#C8D5F0"]],
    illo: "Vintage technical manual engraving, fine ink linework on buff card stock, one element in cobalt blue (#1C4FB8), no text.",
  },
  {
    key: "B", name: "B · Blueprint",
    idea: "An engineer's blueprint: every visual reads like a drawing of a machine. See blueprint.md.",
    bg: "#1E3553", ink: "#EEF3F8", muted: "#8FA7C0", accent: "#F2C14E", fillA: "#274266", fillB: "#274266",
    title: SANS, num: SANS, texture: "grid",
    palette: [["", "#1E3553"], ["", "#EEF3F8"], ["", "#8FA7C0"], ["", "#F2C14E"]],
    illo: "Cyanotype blueprint style technical drawing, white lines on prussian blue, one small yellow annotation, no text.",
  },
  {
    key: "C", name: "C · Ink and seal",
    idea: "A Chinese book page: whitespace, black ink, a single red seal. See ink-and-seal.md.",
    bg: "#F4F4F1", ink: "#1A1A1A", muted: "#9A9A96", accent: "#A8322D", fillA: "#E6E6E1", fillB: "#FFFFFF",
    title: SERIF, num: SERIF, texture: "none",
    palette: [["", "#F4F4F1"], ["", "#1A1A1A"], ["", "#9A9A96"], ["", "#A8322D"]],
    illo: "Minimal Chinese ink wash illustration, black ink and soft gray washes on off-white paper, a single small red seal, generous empty space, no text.",
  },
  {
    key: "D", name: "D · Signal and noise",
    idea: "Gray is noise and the known; only what is truly new is blue. See signal-and-noise.md.",
    bg: "#FFFFFF", ink: "#202124", muted: "#A3A6AD", accent: "#2740D8", fillA: "#EEF0FB", fillB: "#F1F2F4",
    title: SANS, num: SANS, texture: "noise",
    palette: [["", "#FFFFFF"], ["", "#202124"], ["", "#A3A6AD"], ["", "#2740D8"]],
    illo: "Minimal flat illustration in grays on white, one element in ultramarine blue (#2740D8) carries the point, subtle gray dot noise texture, no text.",
  },
  {
    key: "E", name: "E · Warm flat",
    idea: "The original style: white, two category colors, flat and friendly. See warm-flat.md.",
    bg: "#FFFFFF", ink: "#222222", muted: "#888888", accent: "#E4572E", fillA: "#FDE8E1", fillB: "#E6F0FB",
    title: SANS, num: SANS, texture: "none",
    palette: [["", "#FFFFFF"], ["", "#222222"], ["", "#E4572E"], ["", "#2F6DB5"], ["", "#FDE8E1"], ["", "#E6F0FB"]],
    illo: "Flat vector illustration, warm palette (cream background, orange-red #E4572E accents, muted blue), clean lines, minimal shading, friendly exaggerated expressions, no text.",
  }
];

// deterministic pseudo-random for textures
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

function texture(t, w, h) {
  let s = "";
  if (t.texture === "punch") {
    for (let r = 0; r < 10; r++) for (let c = 0; c < 40; c++)
      s += `<text x="${30 + c * 40}" y="${60 + r * 88}" font-family='${t.num}' font-size="16" fill="${t.muted}" opacity=".35">${r}</text>`;
    const R = rng(7);
    for (let c = 0; c < 40; c++) { const r = Math.floor(R() * 10); if (R() < .55) s += `<rect x="${24 + c * 40}" y="${44 + r * 88}" width="14" height="22" fill="${t.ink}" opacity=".18"/>`; }
  } else if (t.texture === "grid") {
    for (let x = 0; x <= w; x += 40) s += `<line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="${t.muted}" stroke-width="${x % 200 ? .6 : 1.4}" opacity=".35"/>`;
    for (let y = 0; y <= h; y += 40) s += `<line x1="0" y1="${y}" x2="${w}" y2="${y}" stroke="${t.muted}" stroke-width="${y % 200 ? .6 : 1.4}" opacity=".35"/>`;
  } else if (t.texture === "noise") {
    const R = rng(11);
    for (let i = 0; i < 900; i++) s += `<circle cx="${R() * w}" cy="${R() * h}" r="${1 + R() * 1.6}" fill="${t.muted}" opacity="${.12 + R() * .2}"/>`;
  }
  return s;
}

function diagram(t) {
  const W = 1600, H = 900, P = [[0.128, 0.872], [0.663, 0.337]], L = ["元音", "辅音"];
  const lineCol = t.texture === "noise" ? t.muted : t.ink;
  const cellStroke = t.texture === "noise" ? "#D5D7DC" : t.muted;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="${t.bg}"/>${texture(t, W, H)}`;
  s += `<defs><marker id="a${t.key}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="${lineCol}"/></marker>
        <marker id="s${t.key}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="${t.accent}"/></marker></defs>`;
  // table
  const x0 = 110, y0 = 250, cw = 190, ch = 100;
  const cells = [["当前 ＼ 下一个", ...L], [L[0], "0.128", "0.872"], [L[1], "0.663", "0.337"]];
  cells.forEach((row, r) => row.forEach((v, c) => {
    const x = x0 + c * cw, y = y0 + r * ch, head = r === 0 || c === 0;
    const hot = r === 2 && c === 1; // the insight: consonant → vowel
    s += `<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="${hot && t.hotFill ? t.hotFill : head ? t.fillA : t.bg}" stroke="${cellStroke}" stroke-width="2"/>`;
    s += `<text x="${x + cw / 2}" y="${y + ch / 2}" text-anchor="middle" dominant-baseline="central" font-family='${head ? t.title : t.num}' font-size="${r === 0 && c === 0 ? 22 : 34}" font-weight="${hot ? 700 : head ? 600 : 400}" fill="${hot ? t.accent : head ? t.ink : t.ink}">${v}</text>`;
  }));
  s += `<text x="${x0}" y="${y0 + 3 * ch + 56}" font-family='${t.title}' font-size="26" fill="${t.muted}">每一行加起来 = 1</text>`;
  // graph
  const V = [900, 470], C = [1300, 470], R = 95;
  const edge = (d, lab, lx, ly, hot) => `<path d="${d}" fill="none" stroke="${hot ? t.accent : lineCol}" stroke-width="${hot ? 6 : 4}" marker-end="url(#${hot ? "s" : "a"}${t.key})"/>
     <text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" font-family='${t.num}' font-size="34" font-weight="${hot ? 700 : 400}" fill="${hot ? t.accent : t.ink}">${lab}</text>`;
  s += edge(`M968 403 Q1100 290 1232 403`, "0.872", 1100, 305);
  s += edge(`M1232 537 Q1100 650 968 537`, "0.663", 1100, 645, true);
  s += edge(`M833 403 C680 320 680 620 833 537`, "0.128", 745, 350);
  s += edge(`M1367 403 C1520 320 1520 620 1367 537`, "0.337", 1455, 350);
  [V, C].forEach(([x, y], i) => {
    s += `<circle cx="${x}" cy="${y}" r="${R}" fill="${t.fillB}" stroke="${t.texture === "noise" ? t.muted : t.ink}" stroke-width="4"/>`;
    s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-family='${t.title}' font-size="42" font-weight="600" fill="${t.ink}">${L[i]}</text>`;
  });
  if (t.key === "C") s += `<rect x="1440" y="760" width="64" height="64" fill="${t.accent}"/><text x="1472" y="793" text-anchor="middle" dominant-baseline="central" font-family='${SERIF}' font-size="36" fill="#F4F4F1">震</text>`;
  s += `<text x="${W / 2}" y="830" text-anchor="middle" font-family='${t.title}' font-size="22" fill="${t.muted}">数据：马尔可夫 1913 年对《叶甫盖尼·奥涅金》的统计</text></svg>`;
  return s;
}

function cover(t) {
  const W = 600, H = 800;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="${t.bg}"/>`;
  if (t.key === "A") {
    for (let r = 0; r < 12; r++) for (let c = 0; c < 14; c++) s += `<text x="${40 + c * 38}" y="${330 + r * 36}" font-family='${MONO}' font-size="14" fill="${t.muted}" opacity=".45">${r % 10}</text>`;
    const R = rng(3); for (let c = 0; c < 14; c++) { const r = Math.floor(R() * 12); s += `<rect x="${35 + c * 38}" y="${318 + r * 36}" width="12" height="18" fill="${t.ink}"/>`; }
    s += `<path d="M0 0H60L0 60z" fill="#fff" opacity=".7"/>`;
    s += `<text x="44" y="120" font-family='${MONO}' font-size="20" fill="${t.accent}">EP01</text>
          <text x="44" y="200" font-family='${SERIF}' font-size="76" font-weight="700" fill="${t.ink}">接龙机器</text>
          <text x="44" y="252" font-family='${SERIF}' font-size="26" fill="${t.ink}">大模型其实只做一件事</text>
          <text x="44" y="770" font-family='${MONO}' font-size="16" fill="${t.muted}">Zhen Under the Noise</text>`;
  } else if (t.key === "B") {
    s += texture(t, W, H);
    s += `<circle cx="190" cy="300" r="70" fill="none" stroke="${t.ink}" stroke-width="3"/><circle cx="410" cy="300" r="70" fill="none" stroke="${t.ink}" stroke-width="3"/>
          <path d="M240 250 Q300 195 360 250" fill="none" stroke="${t.ink}" stroke-width="3"/><path d="M360 350 Q300 405 240 350" fill="none" stroke="${t.accent}" stroke-width="4"/>
          <text x="300" y="440" text-anchor="middle" font-family='${SANS}' font-size="20" fill="${t.accent}">0.663</text>
          <text x="48" y="110" font-family='${SANS}' font-size="64" font-weight="300" fill="${t.ink}">接龙机器</text>`;
    s += `<rect x="300" y="620" width="260" height="140" fill="none" stroke="${t.ink}" stroke-width="2"/><line x1="300" y1="670" x2="560" y2="670" stroke="${t.ink}" stroke-width="1.5"/><line x1="300" y1="715" x2="560" y2="715" stroke="${t.ink}" stroke-width="1.5"/>
          <text x="314" y="652" font-family='${SANS}' font-size="18" fill="${t.ink}">大模型其实只做一件事</text>
          <text x="314" y="698" font-family='${SANS}' font-size="16" fill="${t.muted}">EP01 · 从 0 和 1 到 AI</text>
          <text x="314" y="744" font-family='${SANS}' font-size="16" fill="${t.muted}">Zhen Under the Noise</text>`;
  } else if (t.key === "C") {
    s += `<text font-family='${SERIF}' font-size="92" font-weight="700" fill="${t.ink}">${[..."接龙机器"].map((ch, i) => `<tspan x="440" y="${170 + i * 108}">${ch}</tspan>`).join("")}</text>
          <text font-family='${SERIF}' font-size="26" fill="${t.ink}">${[..."大模型其实只做一件事"].map((ch, i) => `<tspan x="330" y="${180 + i * 36}">${ch}</tspan>`).join("")}</text>
          <rect x="70" y="620" width="90" height="90" fill="${t.accent}"/><text x="115" y="667" text-anchor="middle" dominant-baseline="central" font-family='${SERIF}' font-size="54" fill="${t.bg}">震</text>
          <text x="70" y="110" font-family='${SERIF}' font-size="22" fill="${t.muted}">第一集</text>
          <text x="70" y="760" font-family='${SERIF}' font-size="18" fill="${t.muted}">在喧嚣之外</text>`;
  } else if (t.key === "E") {
    s += `<circle cx="200" cy="470" r="90" fill="#FDE8E1" stroke="#E4572E" stroke-width="5"/><circle cx="410" cy="470" r="90" fill="#E6F0FB" stroke="#2F6DB5" stroke-width="5"/>
          <text x="200" y="470" text-anchor="middle" dominant-baseline="central" font-family='${SANS}' font-size="34" font-weight="700" fill="#E4572E">元音</text>
          <text x="410" y="470" text-anchor="middle" dominant-baseline="central" font-family='${SANS}' font-size="34" font-weight="700" fill="#2F6DB5">辅音</text>
          <text x="44" y="120" font-family='${SANS}' font-size="20" fill="${t.muted}">EP01</text>
          <text x="44" y="210" font-family='${SANS}' font-size="80" font-weight="700" fill="${t.ink}">接龙机器</text>
          <text x="44" y="262" font-family='${SANS}' font-size="26" fill="${t.ink}">大模型其实只做一件事</text>
          <text x="44" y="760" font-family='${SANS}' font-size="18" fill="${t.muted}">Zhen Under the Noise</text>`;
  } else {
    s += texture(t, W, H);
    const R = rng(5); let d = "M40 520";
    for (let x = 40; x <= 560; x += 8) d += ` L${x} ${520 + (R() - .5) * 120 * Math.max(0, 1 - (x - 40) / 360)}`;
    s += `<path d="${d}" fill="none" stroke="${t.accent}" stroke-width="4" stroke-linejoin="round"/>`;
    s += `<text x="44" y="120" font-family='${SANS}' font-size="20" fill="${t.muted}">EP01</text>
          <text x="44" y="210" font-family='${SANS}' font-size="80" font-weight="700" letter-spacing="-2" fill="${t.ink}">接龙机器</text>
          <text x="44" y="262" font-family='${SANS}' font-size="26" fill="${t.ink}">大模型其实只做一件事</text>
          <text x="44" y="760" font-family='${SANS}' font-size="18" fill="${t.muted}">Zhen Under the Noise</text>`;
  }
  return s + `</svg>`;
}

document.getElementById("schemes").innerHTML = schemes.map(t => `
  <section>
    <h2>${t.name}</h2>
    <p class="idea">${t.idea}</p>
    <div class="samples">
      <div>${diagram(t)}<div class="cap">Video 16:9</div></div>
      <div>${cover(t)}<div class="cap">Cover 3:4</div></div>
    </div>
    <dl class="spec">
      <dt>Colors</dt><dd>${t.palette.map(([n, h]) => `<span class="sw"><i style="background:${h}"></i>${n} ${h}</span>`).join("")}</dd>
            <dt>Illustration</dt><dd><code>${t.illo}</code></dd>
    </dl>
  </section>`).join("");
</script>
</body>
</html>
